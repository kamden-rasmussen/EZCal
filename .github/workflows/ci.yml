name: CI

on:
  push:
    branches: [main, "ios-*"]
  pull_request:
    branches: [main, "ios-*"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS build and test
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-
      - name: Create placeholder Secrets.swift
        run: cp Sources/EZCal/Core/Secrets.swift.example Sources/EZCal/Core/Secrets.swift
      - run: swift build
      - run: swift test

  ios-build:
    name: iOS simulator build
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: build/ios-dd
          key: ios-dd-${{ runner.os }}-${{ hashFiles('Apps/iOS/project.yml', 'Sources/**/*.swift', 'Apps/iOS/Sources/**/*.swift') }}
          restore-keys: ios-dd-${{ runner.os }}-
      - name: Create placeholder Secrets.swift
        run: cp Sources/EZCal/Core/Secrets.swift.example Sources/EZCal/Core/Secrets.swift
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: cd Apps/iOS && xcodegen generate
      - name: Build for iOS Simulator
        run: |
          xcodebuild build -project Apps/iOS/EZCaliOS.xcodeproj -scheme EZCaliOS \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios-dd CODE_SIGNING_ALLOWED=NO

  ios-uitests:
    name: iOS UI tests (allowed to fail)
    runs-on: macos-15
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: build/ios-dd
          key: ios-ui-dd-${{ runner.os }}-${{ hashFiles('Apps/iOS/project.yml', 'Sources/**/*.swift', 'Apps/iOS/Sources/**/*.swift') }}
          restore-keys: ios-ui-dd-${{ runner.os }}-
      - name: Create placeholder Secrets.swift
        run: cp Sources/EZCal/Core/Secrets.swift.example Sources/EZCal/Core/Secrets.swift
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: cd Apps/iOS && xcodegen generate
      - name: Pick simulator
        run: |
          UDID=$(xcrun simctl list devices available | grep -E '^ +iPhone' | head -1 | grep -oE '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}')
          test -n "$UDID"
          echo "IOS_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true
      - name: Run UI tests
        run: |
          set +e
          xcodebuild test -project Apps/iOS/EZCaliOS.xcodeproj -scheme EZCaliOS \
            -destination "platform=iOS Simulator,id=$IOS_UDID" \
            -derivedDataPath build/ios-dd CODE_SIGNING_ALLOWED=NO > ui.log 2>&1 &
          PID=$!
          # Hard timeout (30 min). xcodebuild sometimes hangs after finishing,
          # so kill it shortly after the "Executed N tests" summary appears.
          for _ in $(seq 1 360); do
            kill -0 $PID 2>/dev/null || break
            if grep -qE "Executed [0-9]+ tests?, with [0-9]+ failures?" ui.log && grep -qE "^Test Suite 'All tests'|^Test Suite '.*\.xctest' (passed|failed)" ui.log; then
              sleep 10
              kill $PID 2>/dev/null
              break
            fi
            sleep 5
          done
          kill $PID 2>/dev/null
          tail -50 ui.log
          grep -qE "Executed [0-9]+ tests?, with 0 failures" ui.log
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-log
          path: ui.log
          if-no-files-found: ignore
