name: EZCaliOS
options:
  bundleIdPrefix: com.ezcal
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: NO
targets:
  EZCaliOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: ../../Sources/EZCal/Core
        excludes: ["Secrets.swift.example"]
      - path: ../../Sources/EZCal/Store
      - path: ../../Sources/EZCal/Services
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ezcal.app.ios
        INFOPLIST_FILE: Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  EZCaliOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: EZCaliOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ezcal.app.ios.uitests
        TEST_TARGET_NAME: EZCaliOS
        GENERATE_INFOPLIST_FILE: YES
schemes:
  EZCaliOS:
    build:
      targets:
        EZCaliOS: all
    run:
      config: Debug
    test:
      targets:
        - EZCaliOSUITests
